# Origin config for athena.devqueue.co on the host's OpenLiteSpeed, behind Cloudflare's proxy. TLS from
# Cloudflare terminates here and every request is proxied to the Athena gateway on loopback
# (docker-compose.yml publishes 127.0.0.1:4900).
#
# The panel can rewrite the live file, so this copy is the source of truth. Install it only after the
# certificate exists, because the vhssl paths below must point at real files:
#   install -o lsadm -g nobody -m 0750 docker/openlitespeed.vhost.conf \
#     /usr/local/lsws/conf/vhosts/athena.devqueue.co/vhost.conf
#   systemctl reload lsws

docRoot                   $VH_ROOT/public_html
vhDomain                  $VH_NAME
enableGzip                1

vhssl {
  keyFile                 /etc/letsencrypt/live/athena.devqueue.co/privkey.pem
  certFile                /etc/letsencrypt/live/athena.devqueue.co/fullchain.pem
  certChain               1
  sslProtocol             24
  enableECDHE             1
  renegProtection         1
  sslSessionCache         1
  enableSpdy              15
  enableStapling          1
  ocspRespMaxAge          86400
}

# No access log at the edge: the API writes one structured line per request (method, path, status,
# duration, request id), so an edge log would only duplicate it.
errorlog $VH_ROOT/logs/$VH_NAME.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

extprocessor athenagateway {
  type                    proxy
  address                 127.0.0.1:4900
  maxConns                200
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      60
  respBuffer              0
}

# Socket.IO upgrades (live monitoring, announcements, time extensions). Polling falls through to `/`.
websocket /socket.io/ {
  address                 127.0.0.1:4900
}

# Plain HTTP redirects to HTTPS, except the certificate challenge, which must stay plain.
# Cloudflare proxies this host: in Full mode an HTTP visitor reaches port 80 with X-Forwarded-Proto: http
# and is redirected; an HTTPS visitor arrives on 443. The proto check also prevents a redirect loop if the
# zone is ever switched to Flexible (Cloudflare to origin over plain HTTP).
rewrite  {
  enable                  1
  rules                   <<<END_rules
RewriteCond %{HTTPS} !on
RewriteCond %{HTTP:X-Forwarded-Proto} !https
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^(.*)$ https://athena.devqueue.co%{REQUEST_URI} [R=301,L]
  END_rules
}

# Certificate renewals: served from the host's shared challenge directory, never proxied.
context /.well-known/acme-challenge {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge
  allowBrowse             1

  rewrite  {
    enable                  0
  }
  addDefaultCharset       off
}

context / {
  type                    proxy
  handler                 athenagateway
  addDefaultCharset       off
}
