packages:
  - 'apps/*'
  - 'packages/*'

# Install scripts are blocked by default; only these dependencies may run them.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@parcel/watcher': false

# pnpm refuses very fresh releases by default (supply-chain guard). These were reviewed and pinned.
minimumReleaseAgeExclude:
  - '@react-pdf/font@4.2.0'
  - '@react-pdf/layout@5.2.2'
  - '@react-pdf/render@4.7.2'
  - '@react-pdf/renderer@4.9.2'
  - '@react-pdf/stylesheet@6.3.4'
  - '@react-pdf/textkit@7.1.0'
  - '@react-pdf/types@2.15.0'
