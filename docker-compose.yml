# Production: a single instance of Athena on one host.
# Only the gateway publishes a port, on loopback; the host web server terminates TLS and proxies to it.
name: athena

x-service: &service
  restart: unless-stopped
  networks: [athena]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    <<: *service
    image: postgres:18
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: athena
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U athena -d athena']
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256m
    mem_limit: 1g

  api:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    image: athena-api:latest
    environment:
      NODE_ENV: production
      PORT: '4901'
      DATABASE_URL: postgres://athena:${POSTGRES_PASSWORD}@db:5432/athena
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
      LEDGER_SECRET: ${LEDGER_SECRET:?set LEDGER_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4901/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 768m

  web:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: athena-web:latest
    environment:
      NODE_ENV: production
      PORT: '3900'
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m

  gateway:
    <<: *service
    image: caddy:2.10.2-alpine
    ports:
      - 127.0.0.1:4900:80
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
    mem_limit: 128m

networks:
  athena: {}

volumes:
  db-data: {}
